<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multiplayer Bingo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --cell-bg: #334155;
      --cell-text: #f8fafc;
      --border: #475569;
      --crossed: #e11d48;
      --btn: #2563eb;
      --spotlight-bg: #0f172a;
    }
    body.light-theme {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --accent: #0284c7;
      --cell-bg: #e2e8f0;
      --cell-text: #0f172a;
      --border: #cbd5e1;
      --crossed: #ef4444;
      --btn: #2563eb;
      --spotlight-bg: #f8fafc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
    }
    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .theme-toggle-btn {
      background: var(--cell-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
    }
    .panel {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    .btn {
      background: var(--btn);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }
    .btn-secondary { background: #475569; }
    .btn-success { background: #10b981; }
    .btn-danger { background: #ef4444; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .input-group {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    
    .players-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--cell-bg);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .player-row.active-turn {
      background: #f59e0b;
      color: #000;
    }
    .player-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .win-badge {
      color: #facc15;
    }
    .player-row.active-turn .win-badge {
      color: #78350f;
    }
    .score-badge {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Timer Controls & Bar */
    .timer-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      margin-top: 6px;
      font-size: 0.8rem;
    }
    .timer-badge {
      font-weight: 900;
      color: #ef4444;
      font-size: 0.95rem;
    }

    /* Smart Last Called Spotlight */
    .spotlight-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--spotlight-bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      margin: 8px 0;
    }
    .spotlight-label {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .spotlight-number {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      background: var(--cell-bg);
      padding: 2px 12px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* B-I-N-G-O Dynamic Tracker */
    .bingo-tracker {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .letter {
      flex: 1;
      min-width: 24px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 6px;
      background: var(--cell-bg);
      color: #64748b;
      transition: all 0.2s ease;
    }
    .letter.active {
      background: #f59e0b;
      color: #000;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      transform: scale(1.05);
    }

    /* Dynamic Grid */
    .grid-container {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid {
      display: grid;
      gap: 4px;
      width: 100%;
      height: 100%;
    }
    .cell {
      background: var(--cell-bg);
      color: var(--cell-text);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .cell.crossed {
      background: var(--crossed);
      color: white;
      text-decoration: line-through;
      opacity: 0.8;
      cursor: not-allowed;
    }
    .turn-indicator {
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg);
      margin-top: 6px;
    }

    /* Emoji Bar */
    .emoji-bar {
      display: flex;
      justify-content: space-around;
      background: var(--bg);
      padding: 6px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .floating-reaction {
      position: fixed;
      bottom: 80px;
      left: 50%;
      font-size: 2.5rem;
      pointer-events: none;
      animation: floatUp 1.8s forwards ease-out;
      z-index: 9999;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      50% { transform: translate(calc(-50% + (var(--rand-x) * 40px)), -120px) scale(1.3); }
      100% { opacity: 0; transform: translate(calc(-50% + (var(--rand-x) * 80px)), -240px) scale(1); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1>Multiplayer Bingo</h1>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">☀️ Light</button>
  </div>

  <div class="panel" id="lobby-panel">
    <div class="input-group">
      <input type="text" id="player-name" placeholder="Your Name" maxlength="10">
      <input type="text" id="room-pin" placeholder="4-Digit Room Code" maxlength="6">
      
      <label>Host Settings (Size & Rules):</label>
      <select id="grid-size-select" onchange="updateLinesDropdown()">
        <option value="3">3 × 3 (Mini 1-9)</option>
        <option value="4">4 × 4 (Quick 1-16)</option>
        <option value="5" selected>5 × 5 (Classic 1-25)</option>
        <option value="6">6 × 6 (1-36)</option>
        <option value="7">7 × 7 (1-49)</option>
        <option value="8">8 × 8 (1-64)</option>
        <option value="9">9 × 9 (1-81)</option>
        <option value="10">10 × 10 (1-100)</option>
      </select>

      <label>Lines Needed to Win:</label>
      <select id="target-lines-select"></select>
      
      <div class="row" style="margin-top: 6px;">
        <button class="btn" onclick="initHost()">Host Room</button>
        <button class="btn btn-secondary" onclick="initJoin()">Join Room</button>
      </div>
    </div>
    <div id="lobby-status" style="margin-top: 10px; font-size: 0.85rem; text-align: center; color: #94a3b8;">
      Host chooses settings & creates room. Guests enter code & join.
    </div>
  </div>

  <div class="panel" id="game-panel" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.8rem; color: #94a3b8;">Room: <b id="display-room" style="color:var(--accent);"></b> (<span id="display-size">5×5</span> • <span id="display-target">5 Lines</span>)</span>
      <button class="btn btn-danger" style="width: auto; margin: 0; padding: 4px 10px; font-size: 0.75rem;" onclick="location.reload()">Exit</button>
    </div>

    <div class="players-list" id="players-box"></div>

    <div class="timer-control-row" id="timer-vote-bar">
      <span>Turn Timer: <b id="timer-status-text">OFF (0 Votes)</b></span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="timer-badge" id="timer-countdown" style="display:none;">15s</span>
        <button class="btn btn-secondary" style="width:auto; margin:0; padding:2px 8px; font-size:0.75rem;" id="vote-timer-btn" onclick="toggleTimerVote()">⏱️ Vote Timer</button>
      </div>
    </div>

    <div class="spotlight-box" id="spotlight-bar" style="display: none;">
      <span class="spotlight-label" id="spotlight-caller">Last Called:</span>
      <span class="spotlight-number" id="spotlight-num">--</span>
    </div>

    <div class="bingo-tracker" id="tracker-bar" style="margin-top: 8px;"></div>

    <div class="grid-container">
      <div class="grid" id="board"></div>
    </div>

    <div class="turn-indicator" id="turn-box">Set your board to begin</div>
    
    <div class="row" id="setup-buttons">
      <button class="btn btn-secondary" id="random-btn" onclick="randomizeBoard()">Shuffle</button>
      <button class="btn btn-warning" id="manual-btn" onclick="startManualFill()">Manual Fill</button>
      <button class="btn btn-success" id="ready-btn" onclick="setReady()">Ready</button>
    </div>

    <div class="emoji-bar" id="emoji-bar" style="display: none;">
      <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="sendEmoji('🎯')">🎯</button>
      <button class="emoji-btn" onclick="sendEmoji('😱')">😱</button>
      <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
    </div>

    <button class="btn btn-success" id="reset-btn" style="display: none; margin-top: 8px;" onclick="requestReset()">🔄 Play Again / Next Round</button>
  </div>
</div>

<script>
  let isDarkMode = true;
  function toggleTheme() {
    isDarkMode = !isDarkMode;
    document.body.classList.toggle('light-theme', !isDarkMode);
    document.getElementById('theme-btn').innerText = isDarkMode ? '☀️ Light' : '🌙 Dark';
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, duration, type = "sine") {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  };

  let peer = null;
  let isHost = false;
  let myName = "Player";
  let roomCode = "";
  let connections = [];
  let hostConn = null;
