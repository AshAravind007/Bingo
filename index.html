<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multiplayer Bingo v2.1</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --cell-bg: #334155;
      --cell-text: #f8fafc;
      --border: #475569;
      --crossed: #e11d48;
      --btn: #2563eb;
      --spotlight-bg: #0f172a;
    }
    body.light-theme {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --accent: #0284c7;
      --cell-bg: #e2e8f0;
      --cell-text: #0f172a;
      --border: #cbd5e1;
      --crossed: #ef4444;
      --btn: #2563eb;
      --spotlight-bg: #f8fafc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
    }
    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .theme-toggle-btn {
      background: var(--cell-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
    }
    .panel {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 1.4rem;
    }
    .v2-badge {
      background: #10b981;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn {
      background: var(--btn);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }
    .btn-secondary { background: #475569; }
    .btn-success { background: #10b981; }
    .btn-danger { background: #ef4444; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .input-group {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    
    .players-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--cell-bg);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .player-row.active-turn {
      background: #f59e0b;
      color: #000;
    }
    .player-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .win-badge {
      color: #facc15;
    }
    .player-row.active-turn .win-badge {
      color: #78350f;
    }
    .score-badge {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Timer Controls & Bar */
    .timer-control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      margin-top: 6px;
      font-size: 0.8rem;
    }
    .timer-badge {
      font-weight: 900;
      color: #ef4444;
      font-size: 0.95rem;
    }

    /* Smart Last Called Spotlight */
    .spotlight-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--spotlight-bg);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      margin: 8px 0;
    }
    .spotlight-label {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .spotlight-number {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      background: var(--cell-bg);
      padding: 2px 12px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      animation: popIn 0.3s ease;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* B-I-N-G-O Dynamic Tracker */
    .bingo-tracker {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .letter {
      flex: 1;
      min-width: 24px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 6px;
      background: var(--cell-bg);
      color: #64748b;
      transition: all 0.2s ease;
    }
    .letter.active {
      background: #f59e0b;
      color: #000;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      transform: scale(1.05);
    }

    /* Dynamic Grid */
    .grid-container {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid {
      display: grid;
      gap: 4px;
      width: 100%;
      height: 100%;
    }
    .cell {
      background: var(--cell-bg);
      color: var(--cell-text);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .cell.crossed {
      background: var(--crossed);
      color: white;
      text-decoration: line-through;
      opacity: 0.8;
      cursor: not-allowed;
    }
    .turn-indicator {
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      background: var(--bg);
      margin-top: 6px;
    }

    /* Emoji Bar */
    .emoji-bar {
      display: flex;
      justify-content: space-around;
      background: var(--bg);
      padding: 6px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .floating-reaction {
      position: fixed;
      bottom: 80px;
      left: 50%;
      font-size: 2.5rem;
      pointer-events: none;
      animation: floatUp 1.8s forwards ease-out;
      z-index: 9999;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      50% { transform: translate(calc(-50% + (var(--rand-x) * 40px)), -120px) scale(1.3); }
      100% { opacity: 0; transform: translate(calc(-50% + (var(--rand-x) * 80px)), -240px) scale(1); }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <div class="title-row">
      <h1>Multiplayer Bingo</h1>
      <span class="v2-badge">v2.1</span>
    </div>
    <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">☀️ Light</button>
  </div>

  <div class="panel" id="lobby-panel">
    <div class="input-group">
      <input type="text" id="player-name" placeholder="Your Name" maxlength="10">
      <input type="text" id="room-pin" placeholder="4-Digit Room Code" maxlength="6">
      
      <label>Host Settings: Grid Size</label>
      <select id="grid-size-select" onchange="updateLinesDropdown()">
        <option value="3">3 × 3 (Mini 1-9)</option>
        <option value="4">4 × 4 (Quick 1-16)</option>
        <option value="5" selected>5 × 5 (Classic 1-25)</option>
        <option value="6">6 × 6 (1-36)</option>
        <option value="7">7 × 7 (1-49)</option>
        <option value="8">8 × 8 (1-64)</option>
        <option value="9">9 × 9 (1-81)</option>
        <option value="10">10 × 10 (1-100)</option>
      </select>

      <label>Host Settings: Target Lines to Win</label>
      <select id="target-lines-select">
        <option value="1">1 Line (Ultra Fast)</option>
        <option value="2">2 Lines</option>
        <option value="3">3 Lines</option>
        <option value="4">4 Lines</option>
        <option value="5" selected>5 Lines (Classic BINGO)</option>
        <option value="6">6 Lines</option>
        <option value="7">7 Lines</option>
        <option value="8">8 Lines</option>
        <option value="9">9 Lines</option>
        <option value="10">10 Lines</option>
      </select>
      
      <div class="row" style="margin-top: 6px;">
        <button class="btn" onclick="initHost()">Host Room</button>
        <button class="btn btn-secondary" onclick="initJoin()">Join Room</button>
      </div>
    </div>
    <div id="lobby-status" style="margin-top: 10px; font-size: 0.85rem; text-align: center; color: #94a3b8;">
      Host chooses settings & creates room. Guests enter code & join.
    </div>
  </div>

  <div class="panel" id="game-panel" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.8rem; color: #94a3b8;">Room: <b id="display-room" style="color:var(--accent);"></b> (<span id="display-size">5×5</span> • <span id="display-target">5 Lines</span>)</span>
      <button class="btn btn-danger" style="width: auto; margin: 0; padding: 4px 10px; font-size: 0.75rem;" onclick="location.reload()">Exit</button>
    </div>

    <div class="players-list" id="players-box"></div>

    <div class="timer-control-row" id="timer-vote-bar">
      <span>Turn Timer: <b id="timer-status-text">OFF (0 Votes)</b></span>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="timer-badge" id="timer-countdown" style="display:none;">15s</span>
        <button class="btn btn-secondary" style="width:auto; margin:0; padding:2px 8px; font-size:0.75rem;" id="vote-timer-btn" onclick="toggleTimerVote()">⏱️ Vote Timer</button>
      </div>
    </div>

    <div class="spotlight-box" id="spotlight-bar" style="display: none;">
      <span class="spotlight-label" id="spotlight-caller">Last Called:</span>
      <span class="spotlight-number" id="spotlight-num">--</span>
    </div>

    <div class="bingo-tracker" id="tracker-bar" style="margin-top: 8px;"></div>

    <div class="grid-container">
      <div class="grid" id="board"></div>
    </div>

    <div class="turn-indicator" id="turn-box">Set your board to begin</div>
    
    <div class="row" id="setup-buttons">
      <button class="btn btn-secondary" id="random-btn" onclick="randomizeBoard()">Shuffle</button>
      <button class="btn btn-warning" id="manual-btn" onclick="startManualFill()">Manual Fill</button>
      <button class="btn btn-success" id="ready-btn" onclick="setReady()">Ready</button>
    </div>

    <div class="emoji-bar" id="emoji-bar" style="display: none;">
      <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="sendEmoji('🎯')">🎯</button>
      <button class="emoji-btn" onclick="sendEmoji('😱')">😱</button>
      <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
    </div>

    <button class="btn btn-success" id="reset-btn" style="display: none; margin-top: 8px;" onclick="requestReset()">🔄 Play Again / Next Round</button>
  </div>
</div>

<script>
  let isDarkMode = true;
  function toggleTheme() {
    isDarkMode = !isDarkMode;
    document.body.classList.toggle('light-theme', !isDarkMode);
    document.getElementById('theme-btn').innerText = isDarkMode ? '☀️ Light' : '🌙 Dark';
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, duration, type = "sine") {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e){}
  }

  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }
  };

  let peer = null;
  let isHost = false;
  let myName = "Player";
  let roomCode = "";
  let connections = new Map(); // Map peerId -> connection to prevent duplicate hanging sockets
  let hostConn = null;
  
  let gridSize = 5;
  let targetLinesToWin = 5;
  let totalCells = 25;
  let targetLetters = [];

  let players = [];
  let currentTurnIndex = 0;
  let roundStarterIndex = 0;
  let grid = [];
  let crossed = [];
  let gameStarted = false;

  let isManualMode = false;
  let nextManualNumber = 1;

  let timerVotes = new Set();
  let timerActive = false;
  let timerInterval = null;
  let timeLeft = 15;

  const lobbyPanel = document.getElementById('lobby-panel');
  const gamePanel = document.getElementById('game-panel');
  const boardEl = document.getElementById('board');
  const turnBox = document.getElementById('turn-box');
  const readyBtn = document.getElementById('ready-btn');
  const resetBtn = document.getElementById('reset-btn');
  const emojiBar = document.getElementById('emoji-bar');
  const lobbyStatus = document.getElementById('lobby-status');
  const trackerBar = document.getElementById('tracker-bar');
  const targetLinesSelect = document.getElementById('target-lines-select');
  const spotlightBar = document.getElementById('spotlight-bar');
  const spotlightNum = document.getElementById('spotlight-num');
  const spotlightCaller = document.getElementById('spotlight-caller');
  const timerStatusText = document.getElementById('timer-status-text');
  const timerCountdown = document.getElementById('timer-countdown');

  function updateLinesDropdown() {
    const size = parseInt(document.getElementById('grid-size-select').value, 10);
    const maxPossible = Math.min((size * 2) + 2, 10);
    const currentVal = parseInt(targetLinesSelect.value, 10);
    
    targetLinesSelect.innerHTML = '';
    for (let i = 1; i <= maxPossible; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `${i} Line${i > 1 ? 's' : ''}${i === size ? ' (Standard)' : ''}`;
      if (i === (currentVal <= maxPossible ? currentVal : size)) opt.selected = true;
      targetLinesSelect.appendChild(opt);
    }
  }

  function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function getCleanId(pin) {
    return 'bg-v21-' + pin.trim().toUpperCase();
  }

  function setupLetterGoals(size, linesRequired) {
    gridSize = size;
    targetLinesToWin = linesRequired;
    totalCells = size * size;
    
    const alphabet = "BINGOEXCELVICTORY";
    targetLetters = alphabet.slice(0, targetLinesToWin).split('');
    
    trackerBar.innerHTML = '';
    targetLetters.forEach((char, i) => {
      const el = document.createElement('div');
      el.className = 'letter';
      el.id = `let-${i}`;
      el.innerText = char;
      trackerBar.appendChild(el);
    });

    document.getElementById('display-size').innerText = `${size}×${size}`;
    document.getElementById('display-target').innerText = `${targetLinesToWin} Line${targetLinesToWin > 1 ? 's' : ''}`;
    grid = Array(totalCells).fill(0);
    crossed = Array(totalCells).fill(false);
  }

  function updateSpotlight(num, callerName) {
    spotlightBar.style.display = 'flex';
    spotlightNum.innerText = num;
    spotlightCaller.innerText = `Called by ${callerName}:`;
    spotlightNum.style.animation = 'none';
    spotlightNum.offsetHeight;
    spotlightNum.style.animation = 'popIn 0.3s ease';
  }

  function initHost() {
    myName = document.getElementById('player-name').value.trim() || 'Host';
    roomCode = document.getElementById('room-pin').value.trim().toUpperCase();
    const chosenSize = parseInt(document.getElementById('grid-size-select').value, 10);
    const chosenLines = parseInt(document.getElementById('target-lines-select').value, 10);
    if (!roomCode) return alert('Enter a 4-digit code first!');

    lobbyStatus.innerText = "Creating room...";
    lobbyStatus.style.color = "#38bdf8";

    peer = new Peer(getCleanId(roomCode), peerConfig);

    peer.on('open', () => {
      isHost = true;
      setupLetterGoals(chosenSize, chosenLines);
      showGameUI();
      players.push({ id: peer.id, name: myName, ready: false, lines: 0, wins: 0 });
      renderPlayers();
    });

    peer.on('connection', (conn) => {
      // Store and register connection
      connections.set(conn.peer, conn);

      const sendConfig = () => {
        if (conn.open) {
          conn.send({ 
            type: 'init_config', 
            gridSize, 
            targetLinesToWin,
            players,
            currentTurnIndex,
            gameStarted
          });
        }
      };

      if (conn.open) sendConfig();
      else conn.on('open', sendConfig);

      conn.on('data', (data) => handleHostIncomingData(conn, data));
      conn.on('close', () => {
        connections.delete(conn.peer);
        players = players.filter(p => p.id !== conn.peer);
        timerVotes.delete(conn.peer);
        checkTimerMajority();
        broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
        renderPlayers();
      });
    });

    peer.on('error', (err) => {
      lobbyStatus.innerText = err.type === 'unavailable-id' ? "Code '" + roomCode + "' is busy. Try another code!" : "Error: " + err.type;
      lobbyStatus.style.color = "#ef4444";
    });
  }

  function initJoin() {
    myName = document.getElementById('player-name').value.trim() || 'Guest';
    roomCode = document.getElementById('room-pin').value.trim().toUpperCase();
    if (!roomCode) return alert('Enter the Host\'s 4-digit code first!');

    lobbyStatus.innerText = "Connecting to Host...";
    lobbyStatus.style.color = "#38bdf8";

    peer = new Peer(peerConfig);

    peer.on('open', () => {
      hostConn = peer.connect(getCleanId(roomCode), { reliable: true });
      
      hostConn.on('open', () => {
        isHost = false;
        hostConn.send({ type: 'join', name: myName });
      });

      hostConn.on('data', (data) => handleClientIncomingData(data));
      hostConn.on('close', () => alert('Disconnected from host.'));
    });

    peer.on('error', () => {
      lobbyStatus.innerText = "Cannot find room. Ensure Host created it first!";
      lobbyStatus.style.color = "#ef4444";
    });
  }

  function showGameUI() {
    lobbyPanel.style.display = 'none';
    gamePanel.style.display = 'block';
    document.getElementById('display-room').innerText = roomCode;
    createBoard();
    randomizeBoard();
  }

  function broadcast(msg) {
    connections.forEach((conn) => {
      if (conn && conn.open) {
        conn.send(msg);
      }
    });
  }

  function toggleTimerVote() {
    if (isHost) {
      if (timerVotes.has(peer.id)) timerVotes.delete(peer.id);
      else timerVotes.add(peer.id);
      checkTimerMajority();
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'toggle_timer_vote' });
    }
  }

  function checkTimerMajority() {
    const voteCount = timerVotes.size;
    const majority = Math.floor(players.length / 2) + 1;
    const isMajority = voteCount >= majority;

    timerActive = isMajority;
    const timerData = { type: 'sync_timer', voteCount, totalPlayers: players.length, timerActive };
    broadcast(timerData);
    handleTimerSync(timerData);
  }

  function handleTimerSync(data) {
    const isVotingActive = data.timerActive;
    timerStatusText.innerText = `${isVotingActive ? '🟢 ON' : '⚪ OFF'} (${data.voteCount}/${data.totalPlayers} Votes)`;
    timerCountdown.style.display = isVotingActive && gameStarted ? 'inline-block' : 'none';

    if (isVotingActive && gameStarted) {
      startTurnTimer();
    } else {
      clearInterval(timerInterval);
    }
  }

  function startTurnTimer() {
    clearInterval(timerInterval);
    timeLeft = 15;
    timerCountdown.innerText = `${timeLeft}s`;

    timerInterval = setInterval(() => {
      timeLeft--;
      timerCountdown.innerText = `${timeLeft}s`;
      if (timeLeft <= 5) playTone(300, 0.05);

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        autoPickNumberForCurrentPlayer();
      }
    }, 1000);
  }

  function autoPickNumberForCurrentPlayer() {
    const active = players[currentTurnIndex];
    const isMyTurn = (isHost && active && active.id === peer.id) || (!isHost && hostConn && active && active.id === peer.id);

    if (isMyTurn) {
      const availableUncrossedIndices = [];
      for (let i = 0; i < totalCells; i++) {
        if (!crossed[i] && grid[i] !== 0) availableUncrossedIndices.push(i);
      }
      if (availableUncrossedIndices.length > 0) {
        const randomIdx = availableUncrossedIndices[Math.floor(Math.random() * availableUncrossedIndices.length)];
        handleCellClick(randomIdx);
      }
    }
  }

  function handleHostIncomingData(conn, data) {
    if (data.type === 'join') {
      const existing = players.find(p => p.id === conn.peer);
      if (!existing) {
        players.push({ id: conn.peer, name: data.name, ready: false, lines: 0, wins: 0 });
      } else {
        existing.name = data.name;
      }
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
      renderPlayers();
      checkTimerMajority();
    } else if (data.type === 'ready') {
      const p = players.find(x => x.id === conn.peer);
      if (p) p.ready = true;
      checkAllReady();
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
      renderPlayers();
    } else if (data.type === 'score_update') {
      const p = players.find(x => x.id === conn.peer);
      if (p) p.lines = data.lines;
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
      renderPlayers();
    } else if (data.type === 'strike') {
      vibrate(40);
      playTone(440, 0.1);
      crossNumber(data.num);
      updateSpotlight(data.num, data.caller);
      currentTurnIndex = (currentTurnIndex + 1) % players.length;
      broadcast({ type: 'strike', num: data.num, caller: data.caller, currentTurnIndex });
      updateTurnUI();
      renderPlayers();
      if (timerActive) startTurnTimer();
    } else if (data.type === 'win') {
      gameStarted = false;
      clearInterval(timerInterval);
      const p = players.find(x => x.id === conn.peer);
      if (p) {
        p.lines = targetLinesToWin;
        p.wins = (p.wins || 0) + 1;
      }
      broadcast({ type: 'win', winner: data.name, players });
      showWinner(data.name);
      renderPlayers();
    } else if (data.type === 'toggle_timer_vote') {
      if (timerVotes.has(conn.peer)) timerVotes.delete(conn.peer);
      else timerVotes.add(conn.peer);
      checkTimerMajority();
    } else if (data.type === 'emoji') {
      showFloatingEmoji(data.emoji);
      broadcast({ type: 'emoji', emoji: data.emoji });
    } else if (data.type === 'request_reset') {
      resetGameForAll();
    }
  }

  function handleClientIncomingData(data) {
    if (data.type === 'init_config') {
      setupLetterGoals(data.gridSize, data.targetLinesToWin);
      if (data.players) players = data.players;
      showGameUI();
    } else if (data.type === 'sync_players') {
      players = data.players;
      currentTurnIndex = data.currentTurnIndex;
      gameStarted = data.gameStarted;
      renderPlayers();
      if (gameStarted) updateTurnUI();
    } else if (data.type === 'sync_timer') {
      handleTimerSync(data);
    } else if (data.type === 'start') {
      gameStarted = true;
      currentTurnIndex = data.currentTurnIndex;
      document.getElementById('setup-buttons').style.display = 'none';
      emojiBar.style.display = 'flex';
      resetBtn.style.display = 'none';
      updateTurnUI();
      renderPlayers();
      vibrate([50, 50, 50]);
      if (timerActive) startTurnTimer();
    } else if (data.type === 'strike') {
      vibrate(40);
      playTone(440, 0.1);
      crossNumber(data.num);
      updateSpotlight(data.num, data.caller);
      currentTurnIndex = data.currentTurnIndex;
      updateTurnUI();
      renderPlayers();
      if (timerActive) startTurnTimer();
    } else if (data.type === 'win') {
      gameStarted = false;
      clearInterval(timerInterval);
      players = data.players;
      showWinner(data.winner);
      renderPlayers();
    } else if (data.type === 'emoji') {
      showFloatingEmoji(data.emoji);
    } else if (data.type === 'reset') {
      handleLocalReset();
    }
  }

  function startManualFill() {
    if (gameStarted) return;
    isManualMode = true;
    nextManualNumber = 1;
    grid = Array(totalCells).fill(0);
    renderBoard();
    turnBox.innerText = `Tap cell to place: ${nextManualNumber} of ${totalCells}`;
    turnBox.style.color = "#f59e0b";
    vibrate(30);
  }

  function handleManualCellClick(idx) {
    if (grid[idx] !== 0) return;
    grid[idx] = nextManualNumber;
    vibrate(25);
    playTone(300 + nextManualNumber * 10, 0.05);
    nextManualNumber++;
    renderBoard();

    if (nextManualNumber > totalCells) {
      isManualMode = false;
      turnBox.innerText = "Board filled! Press Ready.";
      turnBox.style.color = "#10b981";
      vibrate([40, 60, 40]);
    } else {
      turnBox.innerText = `Tap cell to place: ${nextManualNumber} of ${totalCells}`;
    }
  }

  function sendEmoji(emoji) {
    showFloatingEmoji(emoji);
    vibrate(20);
    if (isHost) {
      broadcast({ type: 'emoji', emoji });
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'emoji', emoji });
    }
  }

  function showFloatingEmoji(emoji) {
    const el = document.createElement('div');
    el.className = 'floating-reaction';
    el.innerText = emoji;
    el.style.setProperty('--rand-x', (Math.random() - 0.5) * 2);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  function triggerCelebrationConfetti() {
    if (typeof confetti === 'function') {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      setTimeout(() => confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } }), 250);
      setTimeout(() => confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } }), 400);
    }
  }

  function renderPlayers() {
    const box = document.getElementById('players-box');
    box.innerHTML = '';
    players.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'player-row' + (gameStarted && idx === currentTurnIndex ? ' active-turn' : '');
      
      let statusText = '';
      if (!gameStarted) {
        statusText = p.ready ? '✅ Ready' : '⏳ Waiting';
      } else {
        const achieved = targetLetters.slice(0, p.lines).join('');
        statusText = achieved ? `[${achieved}] (${p.lines}/${targetLinesToWin})` : `0/${targetLinesToWin}`;
      }

      row.innerHTML = `
        <div class="player-meta">
          <span>${p.name}</span>
          <span class="win-badge">🏆 ${p.wins || 0}</span>
        </div>
        <span class="score-badge">${statusText}</span>
      `;
      box.appendChild(row);
    });
  }

  function setReady() {
    if (grid.includes(0)) {
      alert(`Please fill all numbers 1 to ${totalCells} before pressing Ready!`);
      return;
    }
    readyBtn.disabled = true;
    readyBtn.innerText = "Waiting...";
    vibrate(40);
    if (isHost) {
      const p = players.find(x => x.id === peer.id);
      if (p) p.ready = true;
      renderPlayers();
      checkAllReady();
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'ready' });
    }
  }

  function checkAllReady() {
    if (players.length >= 2 && players.every(p => p.ready)) {
      gameStarted = true;
      currentTurnIndex = roundStarterIndex;
      document.getElementById('setup-buttons').style.display = 'none';
      emojiBar.style.display = 'flex';
      resetBtn.style.display = 'none';
      broadcast({ type: 'start', currentTurnIndex });
      updateTurnUI();
      renderPlayers();
      vibrate([50, 50, 50]);
      if (timerActive) startTurnTimer();
    }
  }

  function updateTurnUI() {
    const active = players[currentTurnIndex];
    if (!active) return;
    const isMyTurn = (isHost && active.id === peer.id) || (!isHost && hostConn && active.id === peer.id);

    if (isMyTurn) {
      turnBox.innerText = "👉 Your Turn! Pick a number.";
      turnBox.style.color = "var(--accent)";
    } else {
      turnBox.innerText = `Waiting for ${active.name}...`;
      turnBox.style.color = "#94a3b8";
    }
  }

  function handleCellClick(idx) {
    if (isManualMode) {
      handleManualCellClick(idx);
      return;
    }
    if (!gameStarted) return;

    const active = players[currentTurnIndex];
    const isMyTurn = (isHost && active.id === peer.id) || (!isHost && hostConn && active.id === peer.id);
    if (!isMyTurn || crossed[idx]) return;

    vibrate(40);
    playTone(520, 0.1);
    const chosenNum = grid[idx];
    crossNumber(chosenNum);
    updateSpotlight(chosenNum, myName);

    if (isHost) {
      currentTurnIndex = (currentTurnIndex + 1) % players.length;
      broadcast({ type: 'strike', num: chosenNum, caller: myName, currentTurnIndex });
      updateTurnUI();
      renderPlayers();
      if (timerActive) startTurnTimer();
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'strike', num: chosenNum, caller: myName });
    }
  }

  function crossNumber(num) {
    const idx = grid.indexOf(num);
    if (idx !== -1) {
      crossed[idx] = true;
      renderBoard();
      checkBingo();
    }
  }

  function showWinner(winnerName) {
    turnBox.innerText = `🎉 ${winnerName} won the Game! 🎉`;
    turnBox.style.color = "#10b981";
    resetBtn.style.display = 'block';
    vibrate([100, 50, 100, 50, 300]);
    triggerCelebrationConfetti();
    playTone(600, 0.2);
    setTimeout(() => playTone(800, 0.3), 200);
  }

  function checkBingo() {
    let lines = 0;

    for (let r = 0; r < gridSize; r++) {
      let fullRow = true;
      for (let c = 0; c < gridSize; c++) {
        if (!crossed[r * gridSize + c]) { fullRow = false; break; }
      }
      if (fullRow) lines++;
    }

    for (let c = 0; c < gridSize; c++) {
      let fullCol = true;
      for (let r = 0; r < gridSize; r++) {
        if (!crossed[r * gridSize + c]) { fullCol = false; break; }
      }
      if (fullCol) lines++;
    }

    let diag1 = true;
    for (let i = 0; i < gridSize; i++) {
      if (!crossed[i * gridSize + i]) { diag1 = false; break; }
    }
    if (diag1) lines++;

    let diag2 = true;
    for (let i = 0; i < gridSize; i++) {
      if (!crossed[i * gridSize + (gridSize - 1 - i)]) { diag2 = false; break; }
    }
    if (diag2) lines++;

    lines = Math.min(lines, targetLinesToWin);

    for (let i = 0; i < targetLinesToWin; i++) {
      const el = document.getElementById(`let-${i}`);
      if (el) {
        if (i < lines) el.classList.add('active');
        else el.classList.remove('active');
      }
    }

    if (isHost) {
      const p = players.find(x => x.id === peer.id);
      if (p && p.lines !== lines) {
        p.lines = lines;
        broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
        renderPlayers();
      }
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'score_update', lines });
    }

    if (lines >= targetLinesToWin && gameStarted) {
      gameStarted = false;
      clearInterval(timerInterval);
      if (isHost) {
        const p = players.find(x => x.id === peer.id);
        if (p) p.wins = (p.wins || 0) + 1;
        broadcast({ type: 'win', winner: myName, players });
      } else if (hostConn && hostConn.open) {
        hostConn.send({ type: 'win', name: myName });
      }
      showWinner(myName);
      renderPlayers();
    }
  }

  function requestReset() {
    if (isHost) resetGameForAll();
    else if (hostConn && hostConn.open) hostConn.send({ type: 'request_reset' });
  }

  function resetGameForAll() {
    players.forEach(p => { 
      p.ready = false; 
      p.lines = 0; 
    });
    gameStarted = false;
    roundStarterIndex = (roundStarterIndex + 1) % players.length;
    currentTurnIndex = roundStarterIndex;
    
    clearInterval(timerInterval);
    broadcast({ type: 'reset' });
    broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
    handleLocalReset();
  }

  function handleLocalReset() {
    crossed = Array(totalCells).fill(false);
    for (let i = 0; i < targetLinesToWin; i++) {
      const el = document.getElementById(`let-${i}`);
      if (el) el.classList.remove('active');
    }
    spotlightBar.style.display = 'none';
    randomizeBoard();
    document.getElementById('setup-buttons').style.display = 'flex';
    emojiBar.style.display = 'none';
    readyBtn.disabled = false;
    readyBtn.innerText = "Ready";
    resetBtn.style.display = 'none';
    
    const starterName = players[roundStarterIndex] ? players[roundStarterIndex].name : 'Next Player';
    turnBox.innerText = `🎯 Next Round Starter: ${starterName}! Shuffle & press Ready.`;
    turnBox.style.color = "var(--text)";
    renderPlayers();
  }

  function createBoard() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    
    const fontSize = gridSize <= 5 ? '1.1rem' : gridSize <= 7 ? '0.9rem' : '0.75rem';

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.fontSize = fontSize;
      cell.onclick = () => handleCellClick(i);
      boardEl.appendChild(cell);
    }
  }

  function randomizeBoard() {
    if (gameStarted) return;
    isManualMode = false;
    grid = Array.from({length: totalCells}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
    renderBoard();
    turnBox.innerText = "Board randomized. Press Ready!";
    turnBox.style.color = "var(--text)";
    vibrate(20);
  }

  function renderBoard() {
    const cells = boardEl.children;
    for (let i = 0; i < totalCells; i++) {
      cells[i].innerText = grid[i] || '';
      cells[i].className = 'cell' + (crossed[i] ? ' crossed' : '');
    }
  }
</script>
</body>
