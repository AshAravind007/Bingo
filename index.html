<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multiplayer Bingo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      max-width: 450px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .panel {
      background: #1e293b;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }
    .btn-secondary { background: #475569; }
    .btn-success { background: #10b981; }
    .btn-danger { background: #ef4444; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .input-group {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
    }
    .row {
      display: flex;
      gap: 6px;
    }
    
    .players-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .player-row.active-turn {
      background: #f59e0b;
      color: #000;
    }
    .player-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .win-badge {
      color: #facc15;
    }
    .player-row.active-turn .win-badge {
      color: #78350f;
    }
    .score-badge {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* B-I-N-G-O Dynamic Tracker */
    .bingo-tracker {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .letter {
      flex: 1;
      min-width: 24px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 6px;
      background: #334155;
      color: #64748b;
      transition: all 0.2s ease;
    }
    .letter.active {
      background: #f59e0b;
      color: #000;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      transform: scale(1.05);
    }

    /* Dynamic Grid */
    .grid-container {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid {
      display: grid;
      gap: 4px;
      width: 100%;
      height: 100%;
    }
    .cell {
      background: #334155;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    .cell.crossed {
      background: #e11d48;
      text-decoration: line-through;
      opacity: 0.8;
      cursor: not-allowed;
    }
    .turn-indicator {
      text-align: center;
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
      background: #0f172a;
      margin-top: 6px;
    }

    /* Emoji Bar */
    .emoji-bar {
      display: flex;
      justify-content: space-around;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
      margin-top: 6px;
    }
    .emoji-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .floating-reaction {
      position: fixed;
      bottom: 80px;
      left: 50%;
      font-size: 2.5rem;
      pointer-events: none;
      animation: floatUp 1.8s forwards ease-out;
      z-index: 9999;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      50% { transform: translate(calc(-50% + (var(--rand-x) * 40px)), -120px) scale(1.3); }
      100% { opacity: 0; transform: translate(calc(-50% + (var(--rand-x) * 80px)), -240px) scale(1); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Multiplayer Bingo</h1>

  <div class="panel" id="lobby-panel">
    <div class="input-group">
      <input type="text" id="player-name" placeholder="Your Name" maxlength="10">
      <input type="text" id="room-pin" placeholder="4-Digit Room Code" maxlength="6">
      
      <label>Host Settings (Size & Rules):</label>
      <select id="grid-size-select" onchange="updateLinesDropdown()">
        <option value="3">3 × 3 (Mini 1-9)</option>
        <option value="4">4 × 4 (Quick 1-16)</option>
        <option value="5" selected>5 × 5 (Classic 1-25)</option>
        <option value="6">6 × 6 (1-36)</option>
        <option value="7">7 × 7 (1-49)</option>
        <option value="8">8 × 8 (1-64)</option>
        <option value="9">9 × 9 (1-81)</option>
        <option value="10">10 × 10 (1-100)</option>
      </select>

      <label>Lines Needed to Win:</label>
      <select id="target-lines-select"></select>
      
      <div class="row" style="margin-top: 6px;">
        <button class="btn" onclick="initHost()">Host Room</button>
        <button class="btn btn-secondary" onclick="initJoin()">Join Room</button>
      </div>
    </div>
    <div id="lobby-status" style="margin-top: 10px; font-size: 0.85rem; text-align: center; color: #94a3b8;">
      Host chooses settings & creates room. Guests enter code & join.
    </div>
  </div>

  <div class="panel" id="game-panel" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.8rem; color: #94a3b8;">Room: <b id="display-room" style="color:#38bdf8;"></b> (<span id="display-size">5×5</span> • <span id="display-target">5 Lines</span>)</span>
      <button class="btn btn-danger" style="width: auto; margin: 0; padding: 4px 10px; font-size: 0.75rem;" onclick="location.reload()">Exit</button>
    </div>

    <div class="players-list" id="players-box"></div>

    <div class="bingo-tracker" id="tracker-bar" style="margin-top: 8px;"></div>

    <div class="grid-container">
      <div class="grid" id="board"></div>
    </div>

    <div class="turn-indicator" id="turn-box">Set your board to begin</div>
    
    <div class="row" id="setup-buttons">
      <button class="btn btn-secondary" id="random-btn" onclick="randomizeBoard()">Shuffle</button>
      <button class="btn btn-warning" id="manual-btn" onclick="startManualFill()">Manual Fill</button>
      <button class="btn btn-success" id="ready-btn" onclick="setReady()">Ready</button>
    </div>

    <div class="emoji-bar" id="emoji-bar" style="display: none;">
      <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="sendEmoji('🎯')">🎯</button>
      <button class="emoji-btn" onclick="sendEmoji('😱')">😱</button>
      <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
    </div>

    <button class="btn btn-success" id="reset-btn" style="display: none; margin-top: 8px;" onclick="requestReset()">🔄 Play Again / Next Round</button>
  </div>
</div>

<script>
  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  };

  let peer = null;
  let isHost = false;
  let myName = "Player";
  let roomCode = "";
  let connections = [];
  let hostConn = null;
  
  let gridSize = 5;
  let targetLinesToWin = 5;
  let totalCells = 25;
  let targetLetters = [];

  let players = [];
  let currentTurnIndex = 0;
  let grid = [];
  let crossed = [];
  let gameStarted = false;

  let isManualMode = false;
  let nextManualNumber = 1;

  const lobbyPanel = document.getElementById('lobby-panel');
  const gamePanel = document.getElementById('game-panel');
  const boardEl = document.getElementById('board');
  const turnBox = document.getElementById('turn-box');
  const readyBtn = document.getElementById('ready-btn');
  const resetBtn = document.getElementById('reset-btn');
  const emojiBar = document.getElementById('emoji-bar');
  const lobbyStatus = document.getElementById('lobby-status');
  const trackerBar = document.getElementById('tracker-bar');
  const targetLinesSelect = document.getElementById('target-lines-select');

  function updateLinesDropdown() {
    const size = parseInt(document.getElementById('grid-size-select').value, 10);
    targetLinesSelect.innerHTML = '';
    const maxPossibleLines = (size * 2) + 2; // rows + cols + 2 diagonals
    for (let i = 1; i <= Math.min(maxPossibleLines, 10); i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `${i} Line${i > 1 ? 's' : ''}${i === size ? ' (Standard)' : ''}`;
      if (i === size) opt.selected = true;
      targetLinesSelect.appendChild(opt);
    }
  }
  updateLinesDropdown();

  function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function getCleanId(pin) {
    return 'bg-room-v3-' + pin.trim().toUpperCase();
  }

  function setupLetterGoals(size, linesRequired) {
    gridSize = size;
    targetLinesToWin = linesRequired;
    totalCells = size * size;
    
    const alphabet = "BINGOEXCELVICTORY";
    targetLetters = alphabet.slice(0, targetLinesToWin).split('');
    
    trackerBar.innerHTML = '';
    targetLetters.forEach((char, i) => {
      const el = document.createElement('div');
      el.className = 'letter';
      el.id = `let-${i}`;
      el.innerText = char;
      trackerBar.appendChild(el);
    });

    document.getElementById('display-size').innerText = `${size}×${size}`;
    document.getElementById('display-target').innerText = `${targetLinesToWin} Line${targetLinesToWin > 1 ? 's' : ''}`;
    grid = Array(totalCells).fill(0);
    crossed = Array(totalCells).fill(false);
  }

  function initHost() {
    myName = document.getElementById('player-name').value.trim() || 'Host';
    roomCode = document.getElementById('room-pin').value.trim().toUpperCase();
    const chosenSize = parseInt(document.getElementById('grid-size-select').value, 10);
    const chosenLines = parseInt(document.getElementById('target-lines-select').value, 10);
    if (!roomCode) return alert('Enter a 4-digit code first!');

    lobbyStatus.innerText = "Creating room...";
    lobbyStatus.style.color = "#38bdf8";

    peer = new Peer(getCleanId(roomCode), peerConfig);

    peer.on('open', () => {
      isHost = true;
      setupLetterGoals(chosenSize, chosenLines);
      showGameUI();
      players.push({ id: peer.id, name: myName, ready: false, lines: 0, wins: 0 });
      renderPlayers();
    });

    peer.on('connection', (conn) => {
      connections.push(conn);
      conn.on('open', () => {
        conn.send({ type: 'init_config', gridSize, targetLinesToWin });
      });
      conn.on('data', (data) => handleHostIncomingData(conn, data));
      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        players = players.filter(p => p.id !== conn.peer);
        broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
        renderPlayers();
      });
    });

    peer.on('error', (err) => {
      lobbyStatus.innerText = err.type === 'unavailable-id' ? "Code '" + roomCode + "' is busy. Try another code!" : "Error: " + err.type;
      lobbyStatus.style.color = "#ef4444";
    });
  }

  function initJoin() {
    myName = document.getElementById('player-name').value.trim() || 'Guest';
    roomCode = document.getElementById('room-pin').value.trim().toUpperCase();
    if (!roomCode) return alert('Enter the Host\'s 4-digit code first!');

    lobbyStatus.innerText = "Connecting to Host...";
    lobbyStatus.style.color = "#38bdf8";

    peer = new Peer(peerConfig);

    peer.on('open', () => {
      hostConn = peer.connect(getCleanId(roomCode), { reliable: true });
      
      hostConn.on('open', () => {
        isHost = false;
        hostConn.send({ type: 'join', name: myName });
      });

      hostConn.on('data', (data) => handleClientIncomingData(data));
      hostConn.on('close', () => alert('Disconnected from host.'));
    });

    peer.on('error', () => {
      lobbyStatus.innerText = "Cannot find room. Ensure Host created it first!";
      lobbyStatus.style.color = "#ef4444";
    });
  }

  function showGameUI() {
    lobbyPanel.style.display = 'none';
    gamePanel.style.display = 'block';
    document.getElementById('display-room').innerText = roomCode;
    createBoard();
    randomizeBoard();
  }

  function broadcast(msg) {
    connections.forEach(c => { if(c.open) c.send(msg); });
  }

  function handleHostIncomingData(conn, data) {
    if (data.type === 'join') {
      players.push({ id: conn.peer, name: data.name, ready: false, lines: 0, wins: 0 });
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
      renderPlayers();
    } else if (data.type === 'ready') {
      const p = players.find(x => x.id === conn.peer);
      if (p) p.ready = true;
      checkAllReady();
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
      renderPlayers();
    } else if (data.type === 'score_update') {
      const p = players.find(x => x.id === conn.peer);
      if (p) p.lines = data.lines;
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
      renderPlayers();
    } else if (data.type === 'strike') {
      vibrate(40);
      crossNumber(data.num);
      currentTurnIndex = (currentTurnIndex + 1) % players.length;
      broadcast({ type: 'strike', num: data.num, currentTurnIndex });
      updateTurnUI();
      renderPlayers();
    } else if (data.type === 'win') {
      gameStarted = false;
      const p = players.find(x => x.id === conn.peer);
      if (p) {
        p.lines = targetLinesToWin;
        p.wins = (p.wins || 0) + 1;
      }
      broadcast({ type: 'win', winner: data.name, players });
      showWinner(data.name);
      renderPlayers();
    } else if (data.type === 'emoji') {
      showFloatingEmoji(data.emoji);
      broadcast({ type: 'emoji', emoji: data.emoji });
    } else if (data.type === 'request_reset') {
      resetGameForAll();
    }
  }

  function handleClientIncomingData(data) {
    if (data.type === 'init_config') {
      setupLetterGoals(data.gridSize, data.targetLinesToWin);
      showGameUI();
    } else if (data.type === 'sync_players') {
      players = data.players;
      currentTurnIndex = data.currentTurnIndex;
      gameStarted = data.gameStarted;
      renderPlayers();
      if (gameStarted) updateTurnUI();
    } else if (data.type === 'start') {
      gameStarted = true;
      currentTurnIndex = data.currentTurnIndex;
      document.getElementById('setup-buttons').style.display = 'none';
      emojiBar.style.display = 'flex';
      resetBtn.style.display = 'none';
      updateTurnUI();
      renderPlayers();
      vibrate([50, 50, 50]);
    } else if (data.type === 'strike') {
      vibrate(40);
      crossNumber(data.num);
      currentTurnIndex = data.currentTurnIndex;
      updateTurnUI();
      renderPlayers();
    } else if (data.type === 'win') {
      gameStarted = false;
      players = data.players;
      showWinner(data.winner);
      renderPlayers();
    } else if (data.type === 'emoji') {
      showFloatingEmoji(data.emoji);
    } else if (data.type === 'reset') {
      handleLocalReset();
    }
  }

  function startManualFill() {
    if (gameStarted) return;
    isManualMode = true;
    nextManualNumber = 1;
    grid = Array(totalCells).fill(0);
    renderBoard();
    turnBox.innerText = `Tap cell to place: ${nextManualNumber} of ${totalCells}`;
    turnBox.style.color = "#f59e0b";
    vibrate(30);
  }

  function handleManualCellClick(idx) {
    if (grid[idx] !== 0) return;
    grid[idx] = nextManualNumber;
    vibrate(25);
    nextManualNumber++;
    renderBoard();

    if (nextManualNumber > totalCells) {
      isManualMode = false;
      turnBox.innerText = "Board filled! Press Ready.";
      turnBox.style.color = "#10b981";
      vibrate([40, 60, 40]);
    } else {
      turnBox.innerText = `Tap cell to place: ${nextManualNumber} of ${totalCells}`;
    }
  }

  function sendEmoji(emoji) {
    showFloatingEmoji(emoji);
    vibrate(20);
    if (isHost) {
      broadcast({ type: 'emoji', emoji });
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'emoji', emoji });
    }
  }

  function showFloatingEmoji(emoji) {
    const el = document.createElement('div');
    el.className = 'floating-reaction';
    el.innerText = emoji;
    el.style.setProperty('--rand-x', (Math.random() - 0.5) * 2);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  function renderPlayers() {
    const box = document.getElementById('players-box');
    box.innerHTML = '';
    players.forEach((p, idx) => {
      const row = document.createElement('div');
      row.className = 'player-row' + (gameStarted && idx === currentTurnIndex ? ' active-turn' : '');
      
      let statusText = '';
      if (!gameStarted) {
        statusText = p.ready ? '✅ Ready' : '⏳ Waiting';
      } else {
        const achieved = targetLetters.slice(0, p.lines).join('');
        statusText = achieved ? `[${achieved}] (${p.lines}/${targetLinesToWin})` : `0/${targetLinesToWin}`;
      }

      row.innerHTML = `
        <div class="player-meta">
          <span>${p.name}</span>
          <span class="win-badge">🏆 ${p.wins || 0}</span>
        </div>
        <span class="score-badge">${statusText}</span>
      `;
      box.appendChild(row);
    });
  }

  function setReady() {
    if (grid.includes(0)) {
      alert(`Please fill all numbers 1 to ${totalCells} before pressing Ready!`);
      return;
    }
    readyBtn.disabled = true;
    readyBtn.innerText = "Waiting...";
    vibrate(40);
    if (isHost) {
      const p = players.find(x => x.id === peer.id);
      if (p) p.ready = true;
      renderPlayers();
      checkAllReady();
      broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
    } else {
      hostConn.send({ type: 'ready' });
    }
  }

  function checkAllReady() {
    if (players.length >= 2 && players.every(p => p.ready)) {
      gameStarted = true;
      currentTurnIndex = 0;
      document.getElementById('setup-buttons').style.display = 'none';
      emojiBar.style.display = 'flex';
      resetBtn.style.display = 'none';
      broadcast({ type: 'start', currentTurnIndex });
      updateTurnUI();
      renderPlayers();
      vibrate([50, 50, 50]);
    }
  }

  function updateTurnUI() {
    const active = players[currentTurnIndex];
    if (!active) return;
    const isMyTurn = (isHost && active.id === peer.id) || (!isHost && hostConn && active.id === peer.id);

    if (isMyTurn) {
      turnBox.innerText = "👉 Your Turn! Pick a number.";
      turnBox.style.color = "#38bdf8";
    } else {
      turnBox.innerText = `Waiting for ${active.name}...`;
      turnBox.style.color = "#94a3b8";
    }
  }

  function handleCellClick(idx) {
    if (isManualMode) {
      handleManualCellClick(idx);
      return;
    }
    if (!gameStarted) return;

    const active = players[currentTurnIndex];
    const isMyTurn = (isHost && active.id === peer.id) || (!isHost && hostConn && active.id === peer.id);
    if (!isMyTurn || crossed[idx]) return;

    vibrate(40);
    const chosenNum = grid[idx];
    crossNumber(chosenNum);

    if (isHost) {
      currentTurnIndex = (currentTurnIndex + 1) % players.length;
      broadcast({ type: 'strike', num: chosenNum, currentTurnIndex });
      updateTurnUI();
      renderPlayers();
    } else {
      hostConn.send({ type: 'strike', num: chosenNum });
    }
  }

  function crossNumber(num) {
    const idx = grid.indexOf(num);
    if (idx !== -1) {
      crossed[idx] = true;
      renderBoard();
      checkBingo();
    }
  }

  function showWinner(winnerName) {
    turnBox.innerText = `🎉 ${winnerName} won the Game! 🎉`;
    turnBox.style.color = "#10b981";
    resetBtn.style.display = 'block';
    vibrate([100, 50, 100, 50, 300]);
  }

  function checkBingo() {
    let lines = 0;

    for (let r = 0; r < gridSize; r++) {
      let fullRow = true;
      for (let c = 0; c < gridSize; c++) {
        if (!crossed[r * gridSize + c]) { fullRow = false; break; }
      }
      if (fullRow) lines++;
    }

    for (let c = 0; c < gridSize; c++) {
      let fullCol = true;
      for (let r = 0; r < gridSize; r++) {
        if (!crossed[r * gridSize + c]) { fullCol = false; break; }
      }
      if (fullCol) lines++;
    }

    let diag1 = true;
    for (let i = 0; i < gridSize; i++) {
      if (!crossed[i * gridSize + i]) { diag1 = false; break; }
    }
    if (diag1) lines++;

    let diag2 = true;
    for (let i = 0; i < gridSize; i++) {
      if (!crossed[i * gridSize + (gridSize - 1 - i)]) { diag2 = false; break; }
    }
    if (diag2) lines++;

    lines = Math.min(lines, targetLinesToWin);

    for (let i = 0; i < targetLinesToWin; i++) {
      const el = document.getElementById(`let-${i}`);
      if (el) {
        if (i < lines) el.classList.add('active');
        else el.classList.remove('active');
      }
    }

    if (isHost) {
      const p = players.find(x => x.id === peer.id);
      if (p && p.lines !== lines) {
        p.lines = lines;
        broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
        renderPlayers();
      }
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'score_update', lines });
    }

    if (lines >= targetLinesToWin && gameStarted) {
      gameStarted = false;
      if (isHost) {
        const p = players.find(x => x.id === peer.id);
        if (p) p.wins = (p.wins || 0) + 1;
        broadcast({ type: 'win', winner: myName, players });
      } else {
        hostConn.send({ type: 'win', name: myName });
      }
      showWinner(myName);
      renderPlayers();
    }
  }

  function requestReset() {
    if (isHost) resetGameForAll();
    else hostConn.send({ type: 'request_reset' });
  }

  function resetGameForAll() {
    players.forEach(p => { 
      p.ready = false; 
      p.lines = 0; 
    });
    gameStarted = false;
    currentTurnIndex = 0;
    broadcast({ type: 'reset' });
    broadcast({ type: 'sync_players', players, currentTurnIndex, gameStarted });
    handleLocalReset();
  }

  function handleLocalReset() {
    crossed = Array(totalCells).fill(false);
    for (let i = 0; i < targetLinesToWin; i++) {
      const el = document.getElementById(`let-${i}`);
      if (el) el.classList.remove('active');
    }
    randomizeBoard();
    document.getElementById('setup-buttons').style.display = 'flex';
    emojiBar.style.display = 'none';
    readyBtn.disabled = false;
    readyBtn.innerText = "Ready";
    resetBtn.style.display = 'none';
    turnBox.innerText = "Shuffle or Manual Fill, then press Ready!";
    turnBox.style.color = "#f8fafc";
    renderPlayers();
  }

  function createBoard() {
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    
    const fontSize = gridSize <= 5 ? '1.1rem' : gridSize <= 7 ? '0.9rem' : '0.75rem';

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.fontSize = fontSize;
      cell.onclick = () => handleCellClick(i);
      boardEl.appendChild(cell);
    }
  }

  function randomizeBoard() {
    if (gameStarted) return;
    isManualMode = false;
    grid = Array.from({length: totalCells}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
    renderBoard();
    turnBox.innerText = "Board randomized. Press Ready!";
    turnBox.style.color = "#f8fafc";
    vibrate(20);
  }

  function renderBoard() {
    const cells = boardEl.children;
    for (let i = 0; i < totalCells; i++) {
      cells[i].innerText = grid[i] || '';
      cells[i].className = 'cell' + (crossed[i] ? ' crossed' : '');
    }
  }
</script>
</body>
</html>
